name: lowlighter-metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: VijayLabKit
          template: classic
          filename: assets/github-metrics.svg
          output_action: commit
          committer_message: "chore: refresh github-metrics"
          config_timezone: Asia/Kolkata
          commits_authoring: VijayLabKit, Ishan Chowdhury, vijayishanchowdhury@gmail.com

          # profile header, community, repositories
          base: header, activity, community, repositories
          base_indepth: yes

          # isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # commit activity per hour of day, per weekday, language activity
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 30
          plugin_habits_from: 1000
          plugin_habits_facts: yes

          # most used languages (by code size) and recently used
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # "Mastered technologies" icon grid. It is built from the topics you star at
          # https://github.com/stars?filter=topics . Star a few (python, owasp, kali-linux...)
          # then uncomment these three lines.
          # plugin_topics: yes
          # plugin_topics_mode: mastered
          # plugin_topics_limit: 24
